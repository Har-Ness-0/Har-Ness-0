<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="wave">
      <path d="M0 0H1200V205C1050 245 930 175 780 200S480 255 330 220S90 190 0 215Z"/>
    </clipPath>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .fade{animation:fade 1.2s ease-out both}
      .fade2{animation:fade 1.2s ease-out .35s both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g clip-path="url(#wave)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
  </g>
  <path d="M1200 205C1050 245 930 175 780 200S480 255 330 220S90 190 0 215" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2"/>
  <text class="t fade" x="600" y="112" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="700" letter-spacing="1">Girish Sharma</text>
  <text class="t fade2" x="600" y="152" text-anchor="middle" fill="#BAE6FD" font-size="19" font-weight="500" letter-spacing="3">FULL-STACK DEVELOPER  ·  AI INTEGRATION</text>
</svg>
